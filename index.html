<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bus Website</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="site-header">
      <img class="site-logo" src="assets/books-logo.png" alt="Books">
    </header>

    <section class="bus-map" aria-label="Bus location map">
      <div class="map-wrapper">
        <iframe
          id="bus-map-frame"
          class="map-frame"
          title="Book Bus location map"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          src="">
        </iframe>
        <img
          id="closed-overlay"
          class="closed-overlay"
          src="assets/closed-sign.png"
          alt="Sorry We're Closed sign">
      </div>
    </section>

    <footer class="contact">
      inquiries <a href="mailto:traitorjacks@gmail.com">traitorjacks@gmail.com</a>
    </footer>
  </main>

  <script src="map-location.js"></script>
  <script>
    const mapFrame = document.getElementById("bus-map-frame");
    const closedOverlay = document.getElementById("closed-overlay");
    const locationText = window.BOOK_BUS_LOCATION || "New York, NY";
    const zoomLevel = window.BOOK_BUS_MAP_ZOOM || 15;
    const mapType = window.BOOK_BUS_MAP_TYPE || "k"; // k = satellite view
    const isOpen = window.BOOK_BUS_IS_OPEN === true;
    const encodedLocation = encodeURIComponent(locationText);

    mapFrame.src = `https://maps.google.com/maps?q=${encodedLocation}&z=${zoomLevel}&t=${mapType}&output=embed`;

    if (closedOverlay) {
  closedOverlay.style.display = isOpen ? "none" : "block";
  }
  </script>

  <!-- Vercel Web Analytics: records page views and visitor geography after deployment on Vercel. -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
