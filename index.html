<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bus Website</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="site-header">
      <img class="site-logo" src="assets/books-logo.png" alt="Books">
    </header>

    <section class="bus-map" aria-label="Bus location map">
      <iframe
        id="bus-map-frame"
        class="map-frame"
        title="Book Bus location map"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        src="">
      </iframe>
      <a id="bus-map-link" class="map-link" href="#" target="_blank" rel="noopener">open map</a>
    </section>

    <section class="image-row" aria-label="Image feed">
      <img src="assets/feed-1.jpg" alt="Uploaded image 1">
      <img src="assets/feed-2.png" alt="Uploaded image 2">
      <img src="assets/feed-3.png" alt="Uploaded image 3">
      <img src="assets/feed-4.png" alt="Uploaded image 4">
      <img src="assets/feed-5.jpg" alt="Uploaded image 5">
    </section>

    <footer class="contact">
      inquiries <a href="mailto:traitorjacks@gmail.com">traitorjacks@gmail.com</a>
    </footer>
  </main>

  <script src="map-location.js"></script>
  <script>
    const mapFrame = document.getElementById("bus-map-frame");
    const mapLink = document.getElementById("bus-map-link");
    const locationText = window.BOOK_BUS_LOCATION || "New York, NY";
    const zoomLevel = window.BOOK_BUS_MAP_ZOOM || 15;
    const encodedLocation = encodeURIComponent(locationText);

    mapFrame.src = `https://maps.google.com/maps?q=${encodedLocation}&z=${zoomLevel}&output=embed`;
    mapLink.href = `https://maps.google.com/maps?q=${encodedLocation}`;
    mapLink.textContent = locationText;
  </script>
</body>
</html>
